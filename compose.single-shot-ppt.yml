services:
  app:
    build:
      target: editorial-ppt
    container_name: ${MINDMAP_EXPERIMENT_CONTAINER_NAME:-zlb-mindmap-editorial}
    environment:
      MINDMAP_PIPELINE_MODE: editorial_ppt_vision
      MINDMAP_EDITORIAL_MODEL: ${MINDMAP_EDITORIAL_MODEL:-}
      MINDMAP_EDITORIAL_RENDER_DPI: ${MINDMAP_EDITORIAL_RENDER_DPI:-120}
      MINDMAP_EDITORIAL_IMAGE_MAX_EDGE: ${MINDMAP_EDITORIAL_IMAGE_MAX_EDGE:-}
      MINDMAP_EDITORIAL_JPEG_QUALITY: ${MINDMAP_EDITORIAL_JPEG_QUALITY:-82}
      MINDMAP_EDITORIAL_RESPONSES_ENABLED: ${MINDMAP_EDITORIAL_RESPONSES_ENABLED:-true}
      MINDMAP_EDITORIAL_UPLOAD_CONCURRENCY: ${MINDMAP_EDITORIAL_UPLOAD_CONCURRENCY:-8}
      MINDMAP_EDITORIAL_MAX_REQUEST_MIB: ${MINDMAP_EDITORIAL_MAX_REQUEST_MIB:-96}
      MINDMAP_EDITORIAL_DRAFT_MAX_OUTPUT_TOKENS: ${MINDMAP_EDITORIAL_DRAFT_MAX_OUTPUT_TOKENS:-}
      MINDMAP_EDITORIAL_REVIEW_MAX_OUTPUT_TOKENS: ${MINDMAP_EDITORIAL_REVIEW_MAX_OUTPUT_TOKENS:-}
      MINDMAP_EDITORIAL_REVISION_MAX_OUTPUT_TOKENS: ${MINDMAP_EDITORIAL_REVISION_MAX_OUTPUT_TOKENS:-14000}
      MINDMAP_EDITORIAL_PATCH_REVISIONS: ${MINDMAP_EDITORIAL_PATCH_REVISIONS:-true}
      MINDMAP_EDITORIAL_PATCH_MAX_OUTPUT_TOKENS: ${MINDMAP_EDITORIAL_PATCH_MAX_OUTPUT_TOKENS:-}
      MINDMAP_EDITORIAL_THINKING_BUDGET: ${MINDMAP_EDITORIAL_THINKING_BUDGET:-}
      MINDMAP_EDITORIAL_REVIEW_THINKING_BUDGET: ${MINDMAP_EDITORIAL_REVIEW_THINKING_BUDGET:-}
      MINDMAP_EDITORIAL_CONTENT_REVIEW_THINKING_BUDGET: ${MINDMAP_EDITORIAL_CONTENT_REVIEW_THINKING_BUDGET:-}
      MINDMAP_EDITORIAL_PATCH_THINKING_BUDGET: ${MINDMAP_EDITORIAL_PATCH_THINKING_BUDGET:-}
      MINDMAP_EDITORIAL_FULL_REWRITE_FALLBACK: ${MINDMAP_EDITORIAL_FULL_REWRITE_FALLBACK:-}
      MINDMAP_EDITORIAL_TIMEOUT_SECONDS: ${MINDMAP_EDITORIAL_TIMEOUT_SECONDS:-300}
      MINDMAP_EDITORIAL_MAX_REVISIONS: ${MINDMAP_EDITORIAL_MAX_REVISIONS:-}
      MINDMAP_EDITORIAL_MAX_DEPTH: ${MINDMAP_EDITORIAL_MAX_DEPTH:-6}
